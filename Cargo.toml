[package]
name = "hw-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Hardware topology and control for Rust — CPU/NUMA discovery, core pinning, NUMA binding, hugepage reservation (Linux)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/hw-kit"
readme = "README.md"
keywords = ["numa", "topology", "cpu", "affinity", "linux"]
categories = ["os::linux-apis", "hardware-support", "memory-management"]
exclude = [".github/", "supply-chain/"]

[package.metadata.layers]
tier = "L1"

# REQ-HW-006: the runtime dependency surface is `libc` only, feature-gated.
# Topology discovery (`hw-discovery`, default) is pure `std` /sys parsing and
# pulls zero dependencies; every syscall surface implies the `libc` feature.
# CI asserts the tree with `deps-are-libc-only` (cargo tree) on top of the
# cargo-deny bans shared workflow job.
[dependencies]
libc = { version = "0.2", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"

[features]
default = ["hw-discovery"]
# Pure-`std` /sys/devices/system/cpu topology discovery (REQ-HW-001). No deps.
hw-discovery = []
# Raw syscall surface that is not NUMA- or hugepage-specific: thread pinning
# via sched_setaffinity + best-effort isolation verification (REQ-HW-002).
libc = ["dep:libc"]
# NUMA hooks over mmap + mbind (REQ-HW-003): raw unsafe hook plus the two
# blessed safe wrappers (MPOL_BIND / MPOL_PREFERRED).
numa = ["libc"]
# Hugepage reservation via mmap(MAP_HUGETLB) (REQ-HW-004); no silent 4 KiB
# fallback — exhaustion is a typed error.
hugepage = ["libc"]

[[test]]
name = "pinning"
required-features = ["libc"]

[[test]]
name = "numa"
required-features = ["numa"]

[[test]]
name = "hugepage"
required-features = ["hugepage"]

# ---------------------------------------------------------------------------
# Lint posture (documented deviation from the estate's `forbid(unsafe_code)`
# default, mirroring uring-kit): hw-kit is a syscall-thin FFI wrapper —
# sched affinity, mmap/mbind, MAP_HUGETLB — so unsafe is inherent. Instead of
# forbidding it, the crate denies `undocumented_unsafe_blocks` and
# `unsafe_op_in_unsafe_fn`: every unsafe block carries a `// SAFETY:`
# justification citing the invariant it relies on (REQ-HW-005), and the
# crate-level `# Safety` section in src/lib.rs audits every site.
# ---------------------------------------------------------------------------
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
